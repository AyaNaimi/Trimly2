<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vishal Krishna • Brand Experience Designer</title>
    <meta name="description" content="Brand experience designer from India.">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://framerusercontent.com" crossorigin>
</head>
<body>
    <header class="nav" id="nav">
        <div class="container nav__inner">
            <a class="nav__brand" href="#" id="nav-brand"></a>
            <nav class="nav__links" id="nav-links" aria-label="Primary"></nav>
            <a class="nav__cta btn btn--accent" id="nav-cta" href="#contact"></a>
            <button class="nav__toggle" id="nav-toggle" type="button" aria-label="Menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <main id="main">
        <section class="hero" id="hero">
            <div class="container hero__layout">
                <div class="hero__copy" id="hero-lines"></div>
                <div class="hero__portrait" data-reveal data-parallax="0.2">
                    <img id="hero-portrait" src="" alt="" width="320" height="320">
                </div>
            </div>
        </section>

        <section class="ticker" aria-hidden="true">
            <div class="ticker__track" id="ticker-track"></div>
        </section>

        <section class="status" id="status">
            <div class="container">
                <div class="status__grid" id="status-grid"></div>
            </div>
        </section>

        <section class="section about" id="about">
            <div class="container about__grid">
                <div class="about__left" data-reveal>
                    <p class="about__role" id="about-role"></p>
                    <p class="about__company" id="about-company"></p>
                    <p class="about__prev-label" id="about-prev-label"></p>
                    <ul class="about__prev-list" id="about-prev"></ul>
                </div>
                <div class="about__right" data-reveal data-reveal-delay="120">
                    <p class="about__bio" id="about-bio"></p>
                    <a class="about__link" id="about-cta" href="#about"></a>
                </div>
            </div>
        </section>

        <section class="section services" id="services">
            <div class="container">
                <h2 class="section__title" data-reveal id="services-title"></h2>
                <div class="services__grid" id="services-grid"></div>
            </div>
        </section>

        <section class="section work" id="work">
            <div class="container">
                <h2 class="section__title" data-reveal id="work-title"></h2>
                <div class="work__grid" id="work-grid"></div>
            </div>
        </section>

        <section class="testimonials" id="testimonials" aria-label="Testimonials">
            <div class="testimonials__track" id="testimonials-track"></div>
        </section>

        <section class="section contact" id="contact">
            <div class="container contact__inner" data-reveal>
                <h2 class="contact__title" id="contact-title"></h2>
                <a class="contact__email" id="contact-email" href=""></a>
                <nav class="contact__social" id="contact-social" aria-label="Social"></nav>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer__inner">
            <span id="footer-copy"></span>
            <span id="footer-credit"></span>
        </div>
    </footer>

    <p class="framer-ref">
        Référence motion originale :
        <a href="framer-export.html">framer-export.html</a>
    </p>

    <script src="config/theme.config.js"></script>
    <script src="config/site.config.js"></script>
    <script src="js/render.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
    <script src="js/animations.js" defer></script>
</body>
</html>
